name: Mac bug report / Mac 问题反馈
description: Report a problem with Mole for Mac / 反馈 Mac App 的问题
labels: [bug, mac-app]
body:
  - type: markdown
    attributes:
      value: |
        Report a problem with **Mole for Mac**. Your feedback helps improve the app.

        这里用于反馈 **Mole for Mac** 的问题，你的反馈能帮助我把 App 做得更好。

        Issues are public. For purchase, activation or refund questions, email **hi@mole.fit**. Keep license keys and personal information out of attachments.

        Issue 是公开的，购买、激活或退款问题发到 **hi@mole.fit**，附件里不要包含激活码或个人信息。
  - type: input
    id: app-version
    attributes:
      label: App version / App 版本
      description: Include the build number and whether this is a Preview / 填写版本、构建号，以及是否为 Preview
      placeholder: "1.15.0 (294)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version / macOS 版本
      placeholder: macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: processor
    attributes:
      label: Processor / 芯片
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 遇到了什么问题？
      description: Describe what happened and what you expected / 说明实际发生的情况和预期结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: How can I reproduce this? If it is intermittent, say so / 说明怎样触发，偶发问题也可以注明
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or logs / 截图或日志
      description: Optional. Remove personal information before attaching files / 可选，上传前移除个人信息
